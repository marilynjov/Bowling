name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same Xcode as local development; the project file is written by Xcode 27.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  packages:
    name: Test ${{ matrix.package }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        package: [BowlingCore, BowlingData]
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path Packages/${{ matrix.package }}

  app:
    name: Build app
    runs-on: xcode-27
    # xcodebuild can hang after a UI test finishes; fail instead of running for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build and test for iOS Simulator
        run: |
          xcodebuild build-for-testing test-without-building \
            -project Bowling.xcodeproj \
            -scheme Bowling \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro' \
            -skip-testing:BowlingUITests/AccessibilityAuditUITests \
            CODE_SIGNING_ALLOWED=NO
      # The accessibility audit's clipping and contrast checks vary with screen size, so it
      # runs on one fixed device, the one it is verified on locally (#14). A retry absorbs a
      # simulator stall (runner crash, app launch timeout); a real finding fails both tries.
      # The test runner has crashed while bootstrapping on a cold simulator, before any test
      # ran, which -retry-tests-on-failure can't retry. So boot the device first and run the
      # whole step a second time if it fails.
      - name: Accessibility audit
        run: |
          xcrun simctl boot 'iPhone 18 Pro Max' || true
          xcrun simctl bootstatus 'iPhone 18 Pro Max' -b
          audit() {
            xcodebuild test-without-building \
              -project Bowling.xcodeproj \
              -scheme Bowling \
              -destination 'platform=iOS Simulator,name=iPhone 18 Pro Max' \
              -only-testing:BowlingUITests/AccessibilityAuditUITests \
              -retry-tests-on-failure -test-iterations 2 \
              CODE_SIGNING_ALLOWED=NO
          }
          audit || { echo "::warning::Audit step failed; running it once more"; audit; }
